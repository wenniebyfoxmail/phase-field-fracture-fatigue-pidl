[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-field-fracture-components"
version = "0.1.0"
description = "Reusable code components for phase-field fracture workflows"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
neural = [
    "torch",
]
observation = [
    "scikit-image",
]

[tool.setuptools]
package-dir = {"" = "source"}

[tool.setuptools.packages.find]
where = ["source"]
include = ["pidl_core*", "fracture_observation*", "fracture_state*"]
