[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phase-field-pidl-core"
version = "0.1.0"
description = "Reusable deterministic mechanics kernels for phase-field PIDL workflows"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
neural = [
    "torch",
]

[tool.setuptools]
package-dir = {"" = "source"}

[tool.setuptools.packages.find]
where = ["source"]
include = ["pidl_core*"]
